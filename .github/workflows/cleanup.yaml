# DESACTIVADO — ADR 0008, misma razon que deploy-pr.yaml. Borra el namespace
# que deploy-pr.yaml creaba en el cluster "prs-gke-cluster" del proyecto de
# Google "online-boutique-ci", que este equipo no controla. Con deploy-pr.yaml
# desactivado no hay namespace que limpiar, y la autenticacion falla siempre:
# el workload identity pool de Google tiene una condicion de atributo que solo
# acepta su propio repositorio.
#
# Fallo en los tres merges que tocaron rutas no ignoradas — 1 y 4 de septiembre
# y 12 de septiembre de 2026 — dejando una marca roja permanente en main.
#
# Se conserva como referencia, no se borra.
#
# Ademas se quita el disparador "pull_request_target", que corre con los
# permisos del repositorio base en lugar de los del fork que propone el cambio.
# En un repositorio publico es el vector clasico para exfiltrar secretos desde
# un Pull Request ajeno, y aqui no aporta nada porque el job no puede completarse.

name: "Clean up deployment"
on:
  workflow_dispatch:
jobs:
  cleanup-namespace:
    runs-on: ubuntu-24.04
    environment: gke-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/816257685787/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-action-runner@online-boutique-ci.iam.gserviceaccount.com'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'
      - name: Delete PR namespace in staging cluster
        if: ${{ always() }}
        timeout-minutes: 20
        run: |
          gcloud container clusters get-credentials $PR_CLUSTER \
              --region $REGION --project $PROJECT_ID
          NAMESPACE="pr${PR_NUMBER}"
          kubectl delete namespace $NAMESPACE --ignore-not-found
        env:
          PROJECT_ID: "online-boutique-ci"
          PR_CLUSTER: "prs-gke-cluster"
          REGION: "us-central1"
          PR_NUMBER: ${{ github.event.number }}
