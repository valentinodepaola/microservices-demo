# CD — despliega la tienda en el clúster local en cada integración a main.
# Tres jobs en cadena: primero corren las pruebas unitarias, después se
# construyen y publican las imágenes en ghcr.io, y el despliegue arranca solo
# si los dos pasaron.
#
# SEGURIDAD — mismas tres reglas no negociables del ADR 0008 (ver
# docs/runner-self-hosted.md): solo `push` a main, environment con revisor
# requerido, y permissions: contents: read.

name: "CD - Desplegar en cada merge a main"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

# Un despliegue a la vez. No se cancela a media aplicacion: dejar el cluster
# a medias es peor que esperar.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  pruebas:
    name: "Pruebas unitarias"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: '10.0'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/shippingservice/go.sum
            src/productcatalogservice/go.sum
            src/frontend/go.sum
      - name: Pruebas de Go
        timeout-minutes: 10
        run: |
          for GO_PACKAGE in "shippingservice" "productcatalogservice" "frontend/validator"; do
            echo "Probando $GO_PACKAGE..."
            pushd src/$GO_PACKAGE
            go test
            popd
          done
      - name: Pruebas de C#
        timeout-minutes: 10
        run: dotnet test src/cartservice/

  # Construye las doce imagenes y las publica en ghcr.io etiquetadas con el
  # commit. Va entre pruebas y deploy porque sin registro no hay fase B: el
  # cluster remoto del issue #37 no puede leer del Docker local de nadie.
  #
  # Corre en ubuntu-24.04 y NO en el runner self-hosted: la Mac es arm64 y el
  # cluster de la fase B es una EC2 x86_64. Ver ADR 0010.
  imagenes:
    name: "Construir y publicar imagenes"
    needs: pruebas
    runs-on: ubuntu-24.04
    # packages: write va a nivel de job, no del workflow, para que deploy
    # conserve el contents: read que exige la regla 3 del ADR 0008.
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45        # build fria de referencia: 11m35s (paso 0)
    steps:
      - uses: actions/checkout@v7

      - name: Instalar skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        # --platform fuerza una sola arquitectura. skaffold.yaml declara amd64
        # y arm64; construir la mitad arm64 aqui saldria emulada con QEMU y no
        # la usa nadie, porque el deploy se construye su propio arm64 abajo.
        #
        # --file-output todavia no hace falta, pero es lo que el issue #37 va a
        # consumir con `skaffold deploy --build-artifacts` para desplegar sin
        # reconstruir.
        run: |
          set -euo pipefail
          skaffold build --push \
            --platform=linux/amd64 \
            --default-repo=ghcr.io/${{ github.repository_owner }} \
            --tag=${{ github.sha }} \
            --file-output=build.json

      - name: Resumen
        # success() y no always() como el resumen de deploy: si el build fallo,
        # build.json no existe y no hay nada que listar.
        if: success()
        run: |
          {
            echo "## Imagenes publicadas en ghcr.io"
            echo ""
            echo "| Imagen | Tag |"
            echo "|---|---|"
            jq -r '.builds[] | "| \(.imageName) | `\(.tag)` |"' build.json
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Desplegar en docker-desktop"
    needs: [pruebas, imagenes]
    runs-on: [self-hosted, order-tracking]
    environment: local-cluster
    timeout-minutes: 30        # build fria de referencia: 11m35s (paso 0)
    env:
      CONTEXTO_ESPERADO: docker-desktop
      # Docker config propia del job, aislada de la del usuario. Ver el paso
      # "Aislar la configuracion de Docker" mas abajo (issue #57).
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-ci
    steps:
      - uses: actions/checkout@v7

      - name: Marcar el inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Aislar la configuracion de Docker
        # El runner arranca desde un LaunchAgent con SessionCreate, o sea una
        # sesion de seguridad propia que no hereda el llavero del usuario. Si
        # Docker pide credenciales de un registro, la construccion muere con
        # "keychain cannot be accessed". No se notaba porque hasta el issue #57
        # ningun despliegue habia construido nada: las doce imagenes salian de
        # cache, y sin construir no hay credenciales que pedir.
        #
        # OJO — QUITAR credsStore NO BASTA. Sin el, Docker en macOS cae en su
        # helper por defecto, que es osxkeychain: el mismo llavero. Medido con
        # un señuelo en el PATH sobre esta misma maquina:
        #
        #   {"auths":{}}                     -> llama a osxkeychain
        #   {"auths":{},"credsStore":""}     -> llama a osxkeychain
        #   {"auths":{},"credsStore":"noop"} -> llama a noop
        #
        # La unica forma de sacar al llavero del camino es darle a Docker un
        # helper propio que devuelva credenciales vacias. No se pierde nada:
        # "auths" en la maquina esta vacio y las imagenes base de los
        # Dockerfiles viven todas en registros publicos.
        #
        # El symlink de cli-plugins es aparte: DOCKER_CONFIG tambien es donde
        # el CLI busca sus plugins, y sin el docker-buildx desaparece y el
        # build muere con "BuildKit is enabled but the buildx component is
        # missing" — skaffold.yaml declara useBuildkit: true.
        #
        # Todo vive en el workspace, no en $HOME, para no tocar la
        # configuracion personal del usuario.
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG/bin"

          cat > "$DOCKER_CONFIG/bin/docker-credential-noop" <<'HELPER'
          #!/bin/sh
          # Credenciales vacias para cualquier registro. Existe solo para que
          # Docker no caiga en osxkeychain. Ver issue #57.
          [ "$1" = "get" ] && { cat >/dev/null; echo '{"Username":"","Secret":""}'; }
          exit 0
          HELPER
          chmod +x "$DOCKER_CONFIG/bin/docker-credential-noop"

          printf '{"auths":{},"credsStore":"noop"}\n' > "$DOCKER_CONFIG/config.json"
          ln -sfn "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          echo "$DOCKER_CONFIG/bin" >> "$GITHUB_PATH"

          PATH="$DOCKER_CONFIG/bin:$PATH" docker buildx version
          PATH="$DOCKER_CONFIG/bin:$PATH" command -v docker-credential-noop

      - name: Apuntar al cluster correcto
        run: |
          set -euo pipefail
          kubectl config use-context "$CONTEXTO_ESPERADO"
          kubectl cluster-info
          # Lo contrario de lo que hace ci-main.yaml, que fuerza local-cluster
          # false para empujar a GKE. Aqui se declara explicito para que una
          # config global heredada no provoque un push a ningun registro.
          skaffold config set --kube-context "$CONTEXTO_ESPERADO" local-cluster true

      - name: Desplegar
        id: deploy
        # No hace falta --platform: skaffold detecta la arquitectura del
        # cluster local solo. El fix real (cartservice truena bajo Rosetta
        # sin el) vive en el profile "local-arm64" de skaffold.yaml, que se
        # activa solo por kubeContext == docker-desktop. Ver paso 0.
        #
        # Reconstruye en local a proposito, en vez de bajar lo que publico el
        # job imagenes: Docker Desktop comparte su almacen con el cluster, y
        # esas imagenes son amd64. Cada merge construye dos veces hasta que el
        # issue #37 reapunte el despliegue al cluster remoto.
        run: skaffold run --tag=${{ github.sha }}

      - name: Esperar a que los Deployments esten disponibles
        run: |
          set -euo pipefail
          for d in adservice cartservice checkoutservice currencyservice \
                   emailservice frontend loadgenerator paymentservice \
                   productcatalogservice recommendationservice \
                   redis-cart shippingservice; do
            kubectl wait --for=condition=available --timeout=600s deployment/$d
          done

      - name: Smoke test - la tienda responde sin errores
        timeout-minutes: 10
        run: |
          set -euo pipefail
          kubectl delete pod -l app=loadgenerator
          REQUEST_COUNT=0
          while [ "$REQUEST_COUNT" -lt 50 ]; do
            sleep 5
            REQUEST_COUNT=$(kubectl logs -l app=loadgenerator | grep Aggregated | awk '{print $2}')
            REQUEST_COUNT=${REQUEST_COUNT:-0}
          done
          ERROR_COUNT=$(kubectl logs -l app=loadgenerator | grep Aggregated | awk '{print $3}' | sed "s/[(][^)]*[)]//g")
          echo "Peticiones: $REQUEST_COUNT · errores: $ERROR_COUNT"
          [ "$ERROR_COUNT" -eq 0 ]

      - name: Rollback automatico
        id: rollback
        # Solo si el despliegue si llego a aplicarse: si `skaffold run` fallo
        # antes de tocar el cluster, no hay nada que revertir y un undo aqui
        # tumbaria la version que esta sana.
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          # redis-cart queda fuera a proposito: usa redis:alpine, imagen fija,
          # no genera revision nueva en cada despliegue.
          for d in adservice cartservice checkoutservice currencyservice \
                   emailservice frontend loadgenerator paymentservice \
                   productcatalogservice recommendationservice shippingservice; do
            kubectl rollout undo deployment/$d || true
          done
          for d in frontend checkoutservice cartservice; do
            kubectl rollout status deployment/$d --timeout=300s || true
          done

      - name: Resumen
        if: always()
        run: |
          DURACION=$(( ($(date +%s) - INICIO) / 60 ))
          {
            echo "## Despliegue en el cluster local"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Tag de las imagenes | \`${GITHUB_SHA}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Rollback | ${{ steps.rollback.outcome || 'no hizo falta' }} |"
            echo "| Duracion | ${DURACION} min |"
            echo "| Tienda | http://localhost |"
          } >> "$GITHUB_STEP_SUMMARY"