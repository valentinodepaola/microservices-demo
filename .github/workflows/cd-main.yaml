# CD — despliega la tienda en el clúster de k3s sobre EC2 en cada integración
# a main. Tres jobs en cadena: primero corren las pruebas unitarias, después
# se construyen y publican las imágenes en ghcr.io, y el despliegue arranca
# solo si los dos pasaron. Los tres corren en máquinas de GitHub, así que un
# merge despliega sin que nadie encienda ni apruebe nada.
#
# Fase B del ADR 0008, con el destino que fijó el ADR 0010 — issue #37.
# Ver docs/despliegue-continuo.md.
#
# SEGURIDAD — las tres reglas del ADR 0008 siguen en pie, aunque una cambió de
# motivo: solo `push` a main o workflow_dispatch (regla 1, que ahora protege
# el token de Vault y no el runner: un PR desde un fork nunca lo alcanza),
# environment declarado (regla 2, sin revisor: ver el comentario del job
# deploy), y permissions: contents: read (regla 3).

name: "CD - Desplegar en cada merge a main"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  # Para volver a desplegar sin un commit nuevo. Hizo falta el 17/10/2026: los
  # workflows del fork amanecieron desactivados, el push del merge de #97 se
  # perdio y GitHub no repite eventos que llegaron con los workflows apagados.
  # Tambien sirve para las pruebas de #81. Desde una rama que no sea main
  # falla en el job deploy: el Environment aws-k3s solo acepta ramas
  # protegidas, asi que el token de Vault sigue sin salir de main.
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez. No se cancela a media aplicacion: dejar el cluster
# a medias es peor que esperar.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  pruebas:
    name: "Pruebas unitarias"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: '10.0'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/shippingservice/go.sum
            src/productcatalogservice/go.sum
            src/checkoutservice/go.sum
            src/orderservice/go.sum
            src/frontend/go.sum
      - name: Pruebas de Go
        timeout-minutes: 10
        run: |
          for GO_PACKAGE in "shippingservice" "productcatalogservice" "checkoutservice" "orderservice" "frontend" "frontend/validator"; do
            echo "Probando $GO_PACKAGE..."
            pushd src/$GO_PACKAGE
            go test
            popd
          done
      - name: Pruebas de C#
        timeout-minutes: 10
        run: dotnet test src/cartservice/

  # Construye las trece imagenes (doce de la tienda + orderservice, #28) y
  # las publica en ghcr.io etiquetadas con el
  # commit. Va entre pruebas y deploy porque sin registro no hay despliegue:
  # el cluster remoto no comparte almacen de imagenes con nadie, asi que la
  # unica forma que tiene de conseguirlas es bajarlas de ahi.
  #
  # Construye para linux/amd64 y nada mas porque el nodo es una EC2 x86_64.
  # Ver ADR 0010.
  imagenes:
    name: "Construir y publicar imagenes"
    needs: pruebas
    runs-on: ubuntu-24.04
    # packages: write va a nivel de job, no del workflow, para que deploy
    # conserve el contents: read que exige la regla 3 del ADR 0008.
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45        # build fria de referencia: 11m35s (paso 0)
    steps:
      - uses: actions/checkout@v7

      - name: Marcar el inicio
        run: echo "INICIO_BUILD=$(date +%s)" >> "$GITHUB_ENV"

      - name: Instalar skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache de artefactos de skaffold
        # Lo que se guarda NO son capas de Docker: esas no sobreviven en un
        # runner de GitHub, que es desechable. Es el indice de skaffold, que
        # asocia un hash de las entradas de cada artefacto con la imagen que
        # produjo. Con ese indice, skaffold reconoce lo que no cambio y lo
        # reetiqueta en el registro en vez de reconstruirlo.
        #
        # Sin esto, cada merge reconstruye las trece aunque no se haya tocado
        # una linea de los servicios. Medido: 7m39s en 82d986f y 8m38s en
        # af2941f, dos merges que solo cambiaron workflows y documentacion.
        #
        # run_id en la clave hace que cada ejecucion guarde una entrada nueva
        # —una clave que ya existe no se sobrescribe— y restore-keys recupera
        # la mas reciente del prefijo.
        uses: actions/cache@v6
        with:
          path: ~/.skaffold/cache
          key: skaffold-${{ runner.os }}-imagenes-${{ github.run_id }}
          restore-keys: |
            skaffold-${{ runner.os }}-imagenes-

      - name: Construir y publicar
        # --platform fuerza una sola arquitectura. skaffold.yaml declara amd64
        # y arm64; construir la mitad arm64 aqui saldria emulada con QEMU y no
        # la usaria nadie: el nodo de k3s es x86_64.
        #
        # --file-output escribe build.json, el indice de que imagen le toca a
        # cada servicio. Es lo que el job deploy consume con
        # `skaffold deploy --build-artifacts` para aplicar sin reconstruir.
        run: |
          set -euo pipefail
          skaffold build --push \
            --platform=linux/amd64 \
            --default-repo=ghcr.io/${{ github.repository_owner }} \
            --tag=${{ github.sha }} \
            --file-output=build.json

      - name: Resumen
        # success() y no always() como el resumen de deploy: si el build fallo,
        # build.json no existe y no hay nada que listar.
        if: success()
        run: |
          # La duracion es la medida del cuarto criterio del issue #45: con la
          # cache tibia, un merge que no toca codigo de los servicios deberia
          # bajar de los ~8 min que costaba reconstruirlos todos.
          DURACION=$(( $(date +%s) - INICIO_BUILD ))
          # build.json lista las trece siempre, construidos o solo reetiquetados
          # — no sirve para saber cuantos se reconstruyeron. Va como conteo de
          # lo publicado, que es lo que el criterio uno pide demostrar.
          PUBLICADAS=$(jq -r '.builds | length' build.json)
          {
            echo "## Imagenes publicadas en ghcr.io"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Publicadas | ${PUBLICADAS} |"
            echo "| Duracion | $((DURACION / 60))m $((DURACION % 60))s |"
            echo ""
            echo "| Imagen | Tag |"
            echo "|---|---|"
            jq -r '.builds[] | "| \(.imageName) | `\(.tag)` |"' build.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el indice de lo construido
        # El puente entre este job y deploy. build.json lista los trece
        # artefactos con su tag en ghcr.io, y es lo que deploy consume con
        # `skaffold deploy --build-artifacts` para aplicar sin reconstruir.
        #
        # Hace falta subirlo porque cada job corre en una maquina virtual
        # propia que GitHub destruye al terminar: el archivo se escribe en una
        # maquina que deja de existir antes de que deploy arranque. Mismo
        # mecanismo que ci-pr.yaml usa para pasar el numero del PR.
        #
        # success() por lo mismo que el resumen de arriba: si el build fallo,
        # build.json no existe y el paso moriria por un archivo ausente en vez
        # de por la causa real.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build.json
          # Solo tiene que sobrevivir de un job al siguiente. El default son
          # 90 dias y llenaria la cuota del repositorio sin motivo.
          retention-days: 1

  deploy:
    name: "Desplegar en k3s sobre EC2"
    needs: [pruebas, imagenes]
    # Fase B (issue #37): el job se muda del runner self-hosted a una maquina
    # de GitHub. La fase A no se borra —el runner y runner-check.yaml siguen
    # siendo validos y son el registro de como se llego hasta aca— pero el
    # despliegue ya no depende de que una Mac este encendida.
    runs-on: ubuntu-24.04
    # Environment nuevo, SIN revisor requerido. El de la fase A lo exigia por
    # la regla 2 del ADR 0008: el runner corria en una maquina del equipo, sin
    # sandbox, con el fork publico. Un runner de GitHub es desechable y
    # aislado, asi que esa razon desaparece. El control humano sigue estando
    # en la proteccion de main, que exige PR y aprobacion para llegar hasta
    # aca. En este Environment, limitado a ramas protegidas, vive VAULT_TOKEN:
    # el kubeconfig y la contrasena de redis-orders ya no estan en GitHub, el
    # job se los pide a Vault (#80).
    environment:
      name: aws-k3s
      # La url deja el enlace a la tienda en la pestana Actions y en la vista
      # de Deployments, que es evidencia del criterio de aceptacion sin tener
      # que abrir los logs.
      url: ${{ steps.tienda.outputs.url }}
    # Baja de 30 a 20: este job ya no construye imagenes, solo aplica. Lo que
    # queda son los 600s del rollout status y los 10 min del smoke test.
    timeout-minutes: 20
    # Donde vive Vault. Sale de `terraform output vault_url`
    # (terraform/aws/outputs.tf). Va escrita aqui y no como variable de GitHub
    # porque si cambia la IP tambien hay que regenerar el certificado de la CA,
    # que vive en el repo (ansible/vault-ca.crt): el cambio pasa por un commit
    # de todos modos.
    env:
      VAULT_ADDR: https://98.94.123.92:8200
    steps:
      - uses: actions/checkout@v7

      - name: Marcar el inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Comprobar que Vault responde
        id: vault_salud
        # Preflight de Vault, igual que el del cluster mas abajo. sys/health es
        # la unica ruta que contesta sin token, y dice el estado con el codigo
        # HTTP: 200 abierto, 503 sellado. Sin este paso, un Vault sellado haria
        # fallar a vault-action con un error que no dice la causa.
        #
        # Vault despierta sellado cada vez que se prende su maquina, o sea,
        # cada vez que se inicia el lab (ADR 0011). Va a pasar seguido.
        #
        # Tambien deja lista la CA para el siguiente paso: vault-action la pide
        # en base64 y en una sola linea (-w0).
        run: |
          set -euo pipefail
          CODIGO=$(curl --cacert ansible/vault-ca.crt --max-time 15 -s -o /dev/null \
            -w '%{http_code}' "$VAULT_ADDR/v1/sys/health" || true)
          case "$CODIGO" in
            200)
              echo "Vault esta abierto." ;;
            503)
              echo "::error::Vault esta sellado. Abrirlo con 2 pedazos de la llave ('vault operator unseal' dos veces, o desde la interfaz web) y darle Re-run failed jobs. Ver vault/README.md."
              exit 1 ;;
            000)
              echo "::error::Vault no responde en $VAULT_ADDR. Lo mas probable es que su instancia de EC2 este detenida porque el lab esta apagado. Si la instancia esta encendida, revisar que el certificado de ansible/vault-ca.crt sea el de este Vault."
              exit 1 ;;
            *)
              echo "::error::Vault respondio con el codigo $CODIGO. Revisar 'vault status'."
              exit 1 ;;
          esac
          echo "ca=$(base64 -w0 ansible/vault-ca.crt)" >> "$GITHUB_OUTPUT"

      - name: Leer los secretos de Vault
        id: vault
        # El pipeline ya no guarda las llaves: las pide (ADR 0011). Se presenta
        # con VAULT_TOKEN, un token de solo lectura que vive en el Environment
        # aws-k3s, y Vault le entrega el kubeconfig y la contrasena de
        # redis-orders. Cada lectura queda en la bitacora de Vault.
        #
        # Las rutas llevan data/ porque el motor es KV version 2: los valores
        # viven en boutique/data/ y la politica pipeline nombra esas rutas.
        #
        # exportEnv: false hace que los valores no queden como variables de
        # entorno de todos los pasos que siguen (skaffold, kubectl, los smoke
        # tests). Solo los reciben los dos pasos que los usan, por
        # steps.vault.outputs.
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          caCertificate: ${{ steps.vault_salud.outputs.ca }}
          exportEnv: false
          secrets: |
            boutique/data/kubeconfig kubeconfig ;
            boutique/data/redis-orders password | redis_password

      - name: Explicar el fallo de Vault
        # Solo corre si vault-action fallo. Si se llego hasta ahi, Vault esta
        # abierto (lo comprobo el paso anterior), asi que el problema es el
        # token o la politica. vault-action solo dice "permission denied".
        #
        # Sin if, un paso lleva un success() implicito y se salta despues de
        # cualquier fallo. failure() es lo que lo deja correr justo entonces.
        if: failure() && steps.vault.outcome == 'failure'
        run: |
          echo "::error::Vault esta abierto pero no entrego los secretos. Lo mas probable es que VAULT_TOKEN haya vencido (dura 7 dias) o que la politica pipeline ya no deje leer boutique/data/. Ver 'Renovar el token del pipeline' en vault/README.md."

      - name: Montar el kubeconfig del k3s
        # En la fase A bastaba `kubectl config use-context docker-desktop`
        # porque el kubeconfig ya vivia en la Mac. Un runner de GitHub arranca
        # limpio: no tiene ningun cluster configurado y hay que darselo.
        #
        # Sale de Vault (paso "Leer los secretos de Vault"), crudo: configurar.sh
        # lo sube tal cual desde el archivo. Antes vivia en el secreto
        # KUBECONFIG_K3S en base64, que ya no existe (#80).
        #
        # Llega por env y no con ${{ }} dentro del run: ${{ }} pega el texto en
        # el script antes de que bash lo lea, y un valor de varias lineas con
        # comillas rompe el script. Por env, bash lo recibe como dato.
        #
        # Va a RUNNER_TEMP y no al workspace porque el workspace es lo que se
        # sube en los artefactos; RUNNER_TEMP se destruye con la maquina.
        env:
          KUBECONFIG_VAULT: ${{ steps.vault.outputs.kubeconfig }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBECONFIG_VAULT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Comprobar que el cluster responde
        # Preflight. En la fase A, con la Mac apagada el despliegue esperaba
        # en cola; aqui la instancia detenida lo hace fallar, porque el
        # laboratorio de AWS Academy apaga las instancias al cerrar sesion.
        #
        # Sin este paso el job moriria diez minutos mas tarde, dentro del
        # rollout status, con un error de conexion que no dice la causa. Con el,
        # muere en 20 segundos diciendo exactamente que pasa.
        run: |
          set -euo pipefail
          if ! kubectl cluster-info --request-timeout=20s; then
            echo "::error::El cluster de k3s no responde. Lo mas probable es que la instancia de EC2 este detenida: el laboratorio de AWS Academy la apaga al cerrar la sesion. Levantar el laboratorio, correr 'terraform apply' si hiciera falta y reintentar este job. Si se recreo el nodo, recargar el kubeconfig en Vault con vault/configurar.sh."
            exit 1
          fi
          kubectl get nodes -o wide

      - name: Crear el Secret de redis-orders
        # redis-orders y orderservice leen su contrasena del Secret redis-orders
        # (#79). Antes lo creaba yo a mano; ahora sale de Vault en cada
        # despliegue, asi que cambiarla en Vault basta para que el siguiente
        # merge actualice el Secret. Redis y orderservice la leen al arrancar:
        # si cambia, hay que reiniciarlos (ver el README del componente).
        #
        # Va despues del preflight del cluster y antes de Desplegar: sin el
        # Secret, los pods se quedan en CreateContainerConfigError.
        #
        # --dry-run=client -o yaml no toca el cluster, solo arma el Secret, y
        # apply lo crea o lo actualiza. Asi sirve igual si ya existe.
        #
        # printf '%s' y no echo: sin salto de linea al final. Con el, la
        # contrasena queda de 49 caracteres y Redis no la acepta.
        env:
          REDIS_PASSWORD: ${{ steps.vault.outputs.redis_password }}
        run: |
          set -euo pipefail
          printf '%s' "$REDIS_PASSWORD" \
            | kubectl create secret generic redis-orders --from-file=password=/dev/stdin \
                --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Instalar skaffold
        # kubectl, kustomize y helm ya vienen en la imagen de ubuntu-24.04.
        # skaffold no. Mismas tres lineas que el job imagenes.
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin

      - name: Bajar el indice de lo construido
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Desplegar
        id: deploy
        # Aqui termina la construccion doble de la fase A. El job ya no
        # construye: aplica las mismas imagenes que el job imagenes publico en
        # ghcr.io, leyendo de build.json que artefacto le toca a cada servicio.
        #
        # Un cluster remoto no comparte almacen con nadie, asi que la unica
        # forma que tiene de conseguir una imagen es bajarla del registro. Los
        # paquetes del fork son publicos, asi que no hace falta imagePullSecret.
        #
        # Sin --tag: los tags ya vienen dentro de build.json. Sin --default-repo
        # ni `config set local-cluster false` —que el issue #37 listaba en su
        # alcance— porque los dos existen para gobernar una construccion, y
        # aqui no hay ninguna. Verificado con `skaffold render --offline`: los
        # doce manifiestos salen apuntando a ghcr.io sin tocar Docker.
        #
        # El profile local-arm64 de skaffold.yaml queda inactivo solo: se
        # activa por kubeContext == docker-desktop. Es lo correcto, el nodo
        # es x86_64.
        #
        # -p order-tracking enciende el seguimiento de pedidos (#28): cambia
        # kubernetes-manifests/ por kustomize/overlays/order-tracking, que
        # agrega orderservice y redis-orders y parcha frontend y
        # checkoutservice. Sin el perfil, el CD seguiria saliendo en verde
        # con la tienda de siempre y el seguimiento nunca llegaria al
        # servidor. Para apagarlo en el CD basta quitar el -p.
        run: skaffold deploy -p order-tracking --build-artifacts=build.json

      - name: Esperar a que los Deployments esten disponibles
        # orderservice y redis-orders entran con el perfil order-tracking.
        # Hay que esperarlos aqui: si no, el smoke test de DBSIZE puede correr
        # antes de que Redis este listo y fallar por una carrera, no por un bug.
        #
        # rollout status y no `kubectl wait --for=condition=available`: este
        # ultimo solo pregunta si hay pods disponibles, y los viejos cuentan.
        # Antes no se notaba porque el status-check de skaffold esperaba el
        # rollout, pero desde la regla de skaffold.yaml (#90) ya no ve los
        # Deployments. En el merge de #102 los catorce dijeron "condition met"
        # en segundos y el smoke test corrio a media actualizacion.
        run: |
          set -euo pipefail
          for d in adservice cartservice checkoutservice currencyservice \
                   emailservice frontend loadgenerator orderservice \
                   paymentservice productcatalogservice recommendationservice \
                   redis-cart redis-orders shippingservice; do
            kubectl rollout status deployment/$d --timeout=600s
          done

      - name: Contar los pedidos que ya habia en redis-orders
        # Punto de partida del smoke test de redis-orders. Los pedidos no
        # expiran y redis-orders ya no se recrea entre despliegues: su imagen
        # es fija y la regla resourceSelector de skaffold.yaml evita que la
        # etiqueta run-id le cambie la plantilla (#90). Asi que desde el
        # segundo merge siempre hay pedidos viejos.
        # El smoke test exige que el numero CREZCA, no solo que sea mayor a 0.
        #
        # redis-orders pide contrasena (#79). redis-cli se autentica DENTRO
        # del pod con la variable que ya tiene el contenedor: las comillas
        # simples hacen que $REDIS_PASSWORD la expanda el sh del pod, no el
        # runner, asi que la contrasena nunca llega a este job ni a su log.
        run: |
          set -euo pipefail
          PEDIDOS_ANTES=$(kubectl exec deploy/redis-orders -- sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli DBSIZE' | tr -dc "0-9" || true)
          echo "Pedidos antes del smoke test: ${PEDIDOS_ANTES:-0}"
          echo "PEDIDOS_ANTES=${PEDIDOS_ANTES:-0}" >> "$GITHUB_ENV"

      - name: Obtener la direccion publica de la tienda
        id: tienda
        # La direccion sale del kubeconfig, no del Service.
        #
        # OJO — `kubectl get svc frontend-external` devuelve 10.0.1.173, la IP
        # PRIVADA del nodo. El ServiceLB de k3s reporta la direccion que la
        # instancia conoce de si misma, y la instancia no sabe que tiene una IP
        # elastica: la traduccion la hace AWS en el borde de la red. Es el
        # mismo fenomeno que el 127.0.0.1 que el kubeconfig trae de fabrica.
        # Comprobado contra el cluster el 20/09/2026.
        #
        # El server del kubeconfig si es la elastica, porque el modulo de
        # Terraform ya lo reescribio al extraerlo. Una sola fuente de verdad, y
        # la misma que el job usa para hablarle al cluster: si el despliegue
        # funciono, esta direccion es correcta por construccion.
        #
        # El puerto va sin :6443 a proposito: ese es el del API de Kubernetes.
        # La tienda la publica el ServiceLB en el 80 del nodo.
        run: |
          set -euo pipefail
          SERVIDOR=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          HOST=${SERVIDOR#https://}
          HOST=${HOST%%:*}
          echo "Tienda: http://${HOST}"
          echo "url=http://${HOST}" >> "$GITHUB_OUTPUT"

      - name: Smoke test - la tienda responde sin errores
        timeout-minutes: 10
        run: |
          set -euo pipefail
          kubectl delete pod -l app=loadgenerator
          REQUEST_COUNT=0
          while [ "$REQUEST_COUNT" -lt 50 ]; do
            sleep 5
            REQUEST_COUNT=$(kubectl logs -l app=loadgenerator | grep Aggregated | awk '{print $2}')
            REQUEST_COUNT=${REQUEST_COUNT:-0}
          done
          ERROR_COUNT=$(kubectl logs -l app=loadgenerator | grep Aggregated | awk '{print $3}' | sed "s/[(][^)]*[)]//g")
          echo "Peticiones: $REQUEST_COUNT · errores: $ERROR_COUNT"
          [ "$ERROR_COUNT" -eq 0 ]

      - name: Smoke test - los pedidos llegan a redis-orders
        # Comprueba el camino completo checkout -> orderservice -> Redis (#28).
        # El loadgenerator hace unas 0.1 compras por segundo, asi que despues
        # del smoke test anterior ya deberia haber pedidos NUEVOS, por encima
        # de PEDIDOS_ANTES; si no, se le dan hasta 3 minutos mas antes de dar
        # el despliegue por roto.
        #
        # redis-cli se autentica dentro del pod, igual que en el conteo de
        # arriba (#79). Si la autenticacion falla, NOAUTH no trae digitos y el
        # conteo da 0: este paso fallaria diciendo que no llegaron pedidos.
        # Si pasa eso, revisar primero el Secret redis-orders.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          PEDIDOS=0
          for i in $(seq 1 36); do
            PEDIDOS=$(kubectl exec deploy/redis-orders -- sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli DBSIZE' | tr -dc "0-9" || true)
            PEDIDOS=${PEDIDOS:-0}
            [ "$PEDIDOS" -gt "$PEDIDOS_ANTES" ] && break
            sleep 5
          done
          echo "Pedidos en redis-orders: $PEDIDOS_ANTES antes, $PEDIDOS despues"
          if [ "$PEDIDOS" -le "$PEDIDOS_ANTES" ]; then
            echo "::error::No llego ningun pedido nuevo a redis-orders con el trafico del loadgenerator. Revisar 'kubectl logs deploy/checkoutservice' y 'kubectl logs deploy/orderservice'."
            exit 1
          fi

      - name: Rollback automatico
        id: rollback
        # Corre si el paso Desplegar llego a EJECUTARSE, salga bien o mal.
        #
        # Antes la condicion era `steps.deploy.outcome == 'success'`, con el
        # razonamiento de que un skaffold que fallo no toco el cluster. Eso es
        # falso: `skaffold deploy` APLICA primero y ESPERA despues. En el
        # despliegue del merge del PR #62 aplico once Deployments y recien
        # entonces murio esperando al doceavo — y el rollback no corrio,
        # porque su condicion asumia que un fallo significaba no haber
        # aplicado nada.
        #
        # != 'skipped' es lo que distingue los dos casos de verdad: si el
        # preflight fallo porque el cluster no responde, este paso queda
        # skipped y no se intenta revertir nada contra una instancia apagada.
        if: failure() && steps.deploy.outcome != 'skipped'
        run: |
          # redis-cart y redis-orders quedan fuera a proposito: usan
          # redis:alpine, imagen fija, y con la regla de skaffold.yaml ya no
          # generan revision nueva en cada despliegue (#90). Un rollout undo
          # los mandaria a una revision vieja, recrearia el pod y borraria
          # sus datos.
          for d in adservice cartservice checkoutservice currencyservice \
                   emailservice frontend loadgenerator orderservice \
                   paymentservice productcatalogservice recommendationservice \
                   shippingservice; do
            kubectl rollout undo deployment/$d || true
          done
          for d in frontend checkoutservice cartservice; do
            kubectl rollout status deployment/$d --timeout=300s || true
          done

      - name: Resumen
        if: always()
        run: |
          DURACION=$(( ($(date +%s) - INICIO) / 60 ))
          {
            echo "## Despliegue en el cluster de k3s sobre EC2"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Tag de las imagenes | \`${GITHUB_SHA}\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Rollback | ${{ steps.rollback.outcome || 'no hizo falta' }} |"
            echo "| Duracion | ${DURACION} min |"
            echo "| Tienda | ${{ steps.tienda.outputs.url || 'no llego a publicarse' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
