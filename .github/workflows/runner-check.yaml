# Verificación del runner self-hosted.
#
# No despliega nada: comprueba que la máquina del equipo está lista para que
# cd-main.yaml corra sobre ella. Es el "trabajo de prueba" del issue #17 y queda
# como diagnóstico permanente — cuando un despliegue falle, este workflow dice en
# menos de un minuto si el problema es la máquina o el pipeline.
#
# SEGURIDAD — el fork es un repositorio público y este job corre en una máquina
# del equipo, sin sandbox y con el usuario de esa persona. Las tres mitigaciones
# del ADR 0008 están aplicadas aquí y no son negociables:
#
#   1. Solo se dispara a mano (workflow_dispatch). Nunca con `pull_request`:
#      eso ejecutaría código de terceros en la máquina.
#   2. environment: local-cluster — exige aprobación humana y solo permite `main`.
#   3. permissions: contents: read — un job comprometido no puede escribir aquí.
#
# Ver docs/runner-self-hosted.md y docs/adr/0008-despliegue-continuo-en-dos-fases.md

name: "Verificación del runner self-hosted"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-check
  cancel-in-progress: false

jobs:
  check:
    name: "Comprobar la máquina del clúster local"
    runs-on: [self-hosted, order-tracking]
    environment: local-cluster
    timeout-minutes: 10
    env:
      CONTEXTO_ESPERADO: docker-desktop
    steps:
      - uses: actions/checkout@v7

      - name: Identificar la máquina
        run: |
          set -euo pipefail
          echo "Equipo:       $(scutil --get ComputerName 2>/dev/null || hostname)"
          echo "Arquitectura: $(uname -m)"
          echo "macOS:        $(sw_vers -productVersion 2>/dev/null || uname -sr)"
          echo "Runner:       ${RUNNER_NAME:-desconocido}"
          echo "Workspace:    ${GITHUB_WORKSPACE}"

      - name: Verificar las herramientas de despliegue
        run: |
          set -euo pipefail
          faltantes=""
          for herramienta in docker kubectl skaffold; do
            if ruta=$(command -v "$herramienta"); then
              echo "OK    $herramienta -> $ruta"
            else
              echo "FALTA $herramienta"
              faltantes="$faltantes $herramienta"
            fi
          done
          if [ -n "$faltantes" ]; then
            echo ""
            echo "El runner no encuentra:$faltantes"
            echo "El servicio usa el PATH guardado en ~/actions-runner/.path, no el de tu shell."
            echo "Instala lo que falte, agrega su ruta a ese archivo y reinicia el servicio:"
            echo "  cd ~/actions-runner && ./svc.sh stop && ./svc.sh start"
            exit 1
          fi
          echo ""
          docker version --format 'docker engine {{.Server.Version}}'
          skaffold version

      - name: Verificar que Docker puede construir sin el llavero
        # El runner arranca desde un LaunchAgent con SessionCreate, o sea una
        # sesion de seguridad propia que no hereda el llavero del usuario. Si
        # Docker pide credenciales de un registro, la construccion muere con
        # "keychain cannot be accessed" — y eso no se nota hasta que un merge
        # cambia codigo y obliga a construir de verdad. Issue #57.
        #
        # Este paso reproduce esa situacion en un minuto: monta el mismo
        # DOCKER_CONFIG aislado que usa cd-main.yaml, pone un señuelo en el
        # PATH para saber si alguien llama al helper de credenciales, y
        # construye una imagen minima con la misma base que rompio el
        # despliegue.
        run: |
          set -uo pipefail
          DIAG="${RUNNER_TEMP}/diag-docker"
          rm -rf "$DIAG"; mkdir -p "$DIAG/bin" "$DIAG/cfg" "$DIAG/ctx"

          echo "== Sesion de seguridad =="
          echo "HOME=$HOME"
          security list-keychains 2>&1 | head -3
          echo "-- ¿responde el llavero en esta sesion? --"
          security find-generic-password -l __no_existe__ 2>&1 | head -2

          echo ""
          echo "== Helpers de credenciales visibles =="
          ls -l /usr/local/bin/docker-credential-* 2>/dev/null || echo "ninguno en /usr/local/bin"

          echo ""
          echo "== Config de Docker del usuario =="
          sed -n '1,20p' "$HOME/.docker/config.json" 2>/dev/null || echo "sin ~/.docker/config.json"

          # Señuelo: registra cualquier invocacion y delega en el real.
          for h in desktop osxkeychain; do
            cat > "$DIAG/bin/docker-credential-$h" <<SH
          #!/bin/sh
          echo "INVOCADO: docker-credential-$h \$*" >> "$DIAG/invocaciones.log"
          exec /usr/local/bin/docker-credential-$h "\$@"
          SH
            chmod +x "$DIAG/bin/docker-credential-$h"
          done

          export DOCKER_CONFIG="$DIAG/cfg"
          export PATH="$DIAG/bin:$PATH"
          echo '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          ln -sfn "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"

          echo ""
          echo "== Config efectiva del job =="
          echo "DOCKER_CONFIG=$DOCKER_CONFIG"
          cat "$DOCKER_CONFIG/config.json"
          docker buildx version || echo "buildx NO disponible"
          echo "-- builders --"
          docker buildx ls 2>&1 | head -5

          echo ""
          echo "== Construccion de prueba, con la base que rompio el despliegue =="
          printf 'FROM --platform=linux/arm64 golang:1.26.5-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2\nRUN true\n' > "$DIAG/ctx/Dockerfile"
          docker buildx build --platform=linux/arm64 --pull --no-cache -q "$DIAG/ctx" 2>&1 | tail -15
          RESULTADO=${PIPESTATUS[0]}

          echo ""
          echo "== ¿Alguien llamo al helper de credenciales? =="
          if [ -f "$DIAG/invocaciones.log" ]; then
            sort "$DIAG/invocaciones.log" | uniq -c
            echo "^ el aislamiento de DOCKER_CONFIG NO esta evitando la llamada"
          else
            echo "nadie lo llamo — el aislamiento funciona"
          fi

          echo ""
          if [ "$RESULTADO" -eq 0 ]; then
            echo "RESULTADO: Docker puede construir en esta sesion."
          else
            echo "RESULTADO: Docker NO puede construir en esta sesion."
            echo "Si el error menciona el llavero, es el issue #57."
            exit 1
          fi

      - name: Verificar el contexto de Kubernetes
        run: |
          set -euo pipefail
          contexto=$(kubectl config current-context)
          echo "Contexto activo: $contexto"
          if [ "$contexto" != "$CONTEXTO_ESPERADO" ]; then
            echo "Se esperaba '$CONTEXTO_ESPERADO'."
            echo "Desplegar contra otro clúster es exactamente lo que no queremos."
            exit 1
          fi
          kubectl get nodes

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Verificación del runner self-hosted"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Máquina | \`$(scutil --get ComputerName 2>/dev/null || hostname)\` ($(uname -m)) |"
            echo "| Runner | \`${RUNNER_NAME:-desconocido}\` |"
            echo "| Contexto | \`$(kubectl config current-context 2>/dev/null || echo 'no disponible')\` |"
            echo "| docker | \`$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'no disponible')\` |"
            echo "| skaffold | \`$(skaffold version 2>/dev/null || echo 'no disponible')\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
