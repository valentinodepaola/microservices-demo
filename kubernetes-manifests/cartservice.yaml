apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      serviceAccountName: cartservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: cartservice
        ports:
        - containerPort: 7070
        env:
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        resources:
          requests:
            # Se midio 6 a 10m de uso el 23/09/26
            # Antes teniamos 200m el upstream lo pedia
            # Se bajo porque el rolling update necesita lugar para que el pod viejo
            # y el nuevo convivan un momento, y con orderservice y redis-orders ya
            # no alcanzaba. Ver #71.
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 15
          grpc:
            port: 7070
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  # Recreate y no RollingUpdate: con el disco, el Redis viejo tiene que
  # apagarse (y guardar) antes de que el nuevo lea la misma carpeta. Si no,
  # conviven un momento y el viejo pisa lo que el nuevo ya escribio (#90).
  # rollingUpdate: null borra lo que Kubernetes rellena solo; sin eso,
  # kubectl apply rechaza el cambio de estrategia.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: redis
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: redis:alpine
        # appendonly: apunta cada escritura en el disco, no solo una foto de
        # vez en cuando. Si el lab se apaga de golpe se pierde a lo mucho un
        # segundo de carritos (#90).
        args: ["--appendonly", "yes"]
        ports:
        - containerPort: 6379
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: 6379
        livenessProbe:
          periodSeconds: 5
          tcpSocket:
            port: 6379
        volumeMounts:
        - mountPath: /data
          name: redis-data
        resources:
          limits:
            memory: 256Mi
            cpu: 125m
          requests:
            cpu: 70m
            memory: 200Mi
      volumes:
      - name: redis-data
        # Antes era un emptyDir, que se borra con el pod, y cada despliegue
        # recrea el pod (#90). El disco sobrevive a eso y a apagar el lab.
        persistentVolumeClaim:
          claimName: redis-cart-data
---
# Sin storageClassName usa la clase por omision: local-path en k3s, que
# guarda en el disco del nodo (/var/lib/rancher/k3s/storage), y hostpath en
# Docker Desktop. Solo se pierde si se destruye la instancia.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-cart-data
  labels:
    app: redis-cart
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
  - name: tcp-redis
    port: 6379
    targetPort: 6379
