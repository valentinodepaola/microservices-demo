# Configura Vault y lo deja encendido. Usa vault_tls_dir del rol vault_tls,
# que tiene que correr antes.
- name: Escribir la configuracion de Vault
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: "0640"
  notify: Reiniciar Vault

- name: Crear la carpeta de la bitacora de auditoria
  ansible.builtin.file:
    path: /var/log/vault
    state: directory
    owner: vault
    group: vault
    mode: "0750"

- name: Encender Vault y dejarlo habilitado al arrancar la maquina
  ansible.builtin.systemd_service:
    name: vault
    state: started
    enabled: true
