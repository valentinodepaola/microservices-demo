# Lo que renderiza el perfil `order-tracking` de skaffold.yaml (#28).
#
# Por qué existe: skaffold.yaml renderiza kubernetes-manifests/ y no
# kustomize/ (las "dos rutas de manifiestos" del ADR 0007). El perfil
# network-policies agrega su componente como una ruta aparte, y eso le basta
# porque solo suma recursos. order-tracking además PARCHA frontend y
# checkoutservice, y un parche solo encuentra su Deployment si los dos se
# construyen en la misma pasada de kustomize. Por eso el perfil cambia la
# ruta por esta, que es kubernetes-manifests/ con el componente encima.
#
# Las imágenes salen de kubernetes-manifests/ (nombres cortos que Skaffold
# reemplaza), no de kustomize/base/ (que trae las de Google ya etiquetadas).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../kubernetes-manifests
components:
- ../../components/order-tracking
