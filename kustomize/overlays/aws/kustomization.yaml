# Lo que renderiza el perfil `aws` de skaffold.yaml: la tienda como se
# despliega en el clúster de AWS.
#
# Es el overlay order-tracking más el https (#68). Los tres componentes van
# en la misma pasada de kustomize porque los tres parchan Deployments o
# Services de kubernetes-manifests/ (ver el comentario del overlay
# order-tracking):
# - order-tracking: orderservice, redis-orders y sus parches (#28).
# - non-public-frontend: quita frontend-external, que ocupaba el puerto 80
#   del nodo. Ahora el 80 y el 443 son de Traefik.
# - https: Traefik, el Ingress y el banner de AWS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../kubernetes-manifests
components:
- ../../components/order-tracking
- ../../components/non-public-frontend
- ../../components/https
