# La tienda por https con Let's Encrypt (#68). Solo sirve en el clúster de
# AWS: necesita el helm-controller de k3s, el puerto 80 del nodo libre (ver
# non-public-frontend en el overlay aws) y un nombre que apunte a la IP.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- traefik.yaml
- ingress.yaml
patches:
# El banner de la izquierda dice en qué nube corre la tienda. Sin esto dice
# "local". Va aquí y no en kubernetes-manifests/ para que en Docker Desktop
# siga diciendo "local".
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: ENV_PLATFORM
              value: "aws"
